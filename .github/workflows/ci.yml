name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The test suite mocks the local LLM (llama.cpp) and lazy-imports the
      # embedding/vector backends, so CI installs the package without the heavy
      # ML wheels (torch / transformers / sentence-transformers / llama-cpp-python)
      # and runs the full 142-test suite against the pure-Python core.
      - name: Install package + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install numpy scipy fastapi uvicorn pydantic python-multipart \
                      httpx rich click pyyaml tqdm pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -q
