[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["pebblemind*"]
exclude = ["tests*", "desktop*", "data*", "docs*", "examples*", "scripts*"]

[project]
name = "pebblemind"
version = "0.1.0"
description = "CPU-first local AI assistant: run small LLMs, RAG, and an OpenAI-compatible API entirely on your own machine."
readme = "README.md"
license = "MIT"
authors = [
    {name = "Stephen Keehn"}
]
keywords = ["ai", "assistant", "local", "cpu", "privacy", "llm", "rag", "voice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "llama-cpp-python>=0.2.90",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "sqlite-vec>=0.1.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0",
]
voice = [
    "pyaudio>=0.2.13",
    "soundfile>=0.11.0",
    "librosa>=0.10.0",
]
desktop = [
    "tauri>=2.0.0",
    "tauri-cli>=2.0.0",
]

[project.scripts]
pebblemind = "pebblemind.cli:main"
pebblemind-api = "pebblemind.api.server:main"

[project.urls]
Homepage = "https://github.com/skeehn/pebblemind"
Repository = "https://github.com/skeehn/pebblemind"
Issues = "https://github.com/skeehn/pebblemind/issues"
